name: acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor SETUP.md claims (18) and a current release.
        node-version: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: preflight must PASS
        run: node check_deps.js
      - name: the clean example must pass the checker
        run: |
          cd examples/roastery-weekly
          node ../../action_check.js actions.json --kit .
      - name: the unowned example must be refused with exit 1
        run: |
          cd examples/unowned-action
          code=0
          node ../../action_check.js actions.json --kit . || code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 (refused), got $code"
            exit 1
          fi
          echo "refused, exit 1, as documented."
      - name: the clean example must build one page
        run: |
          cd examples/roastery-weekly
          node ../../build_action_list.js actions.json --kit . --out "$RUNNER_TEMP/built.docx"
          test -s "$RUNNER_TEMP/built.docx"
